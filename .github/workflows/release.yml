name: Release

# Runs when a vX.Y.Z tag is pushed. Fails if the tag disagrees with project.yml
# or CHANGELOG.md has no entry; otherwise publishes the GitHub Release from the
# CHANGELOG section. No binaries: the only official build is the App Store one,
# which Xcode Cloud archives from the same tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match MARKETING_VERSION and have a CHANGELOG entry
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -nE 's/^ *MARKETING_VERSION: "([^"]+)"$/\1/p' project.yml)
          [ "$tag" = "$version" ] || { echo "::error::tag v$tag != project.yml MARKETING_VERSION $version"; exit 1; }
          # Section body: from "## [tag]" up to the next "## [" heading.
          awk -v v="$tag" '/^## \[/{p=($0 ~ "^## \\[" v "\\]")} p' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no ## [$tag] section"; exit 1; }
          cat notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
