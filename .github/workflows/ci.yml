name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Show versions
        run: swift --version && xcodebuild -version

      - name: Format check
        run: |
          xcrun swift-format lint --recursive --strict Pano Packages

      - name: Build
        run: |
          xcodebuild build \
            -project Pano.xcodeproj \
            -scheme Pano \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || xcodebuild build -project Pano.xcodeproj -scheme Pano -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project Pano.xcodeproj \
            -scheme Pano \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
