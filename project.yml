# Source of truth for Pano.xcodeproj. Regenerate after editing: `xcodegen generate`.
# The generated project is committed so CI and contributors need no extra tool.
name: Pano
options:
  bundleIdPrefix: com.cancetin
  deploymentTarget:
    macOS: "15.4"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release
  DebugDirect: debug
  ReleaseDirect: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_HARDENED_RUNTIME: YES

packages:
  PanoCore:
    path: Packages/PanoCore
  PanoStore:
    path: Packages/PanoStore
  PanoTransforms:
    path: Packages/PanoTransforms
  PanoUI:
    path: Packages/PanoUI

targets:
  Pano:
    type: application
    platform: macOS
    sources:
      - path: Pano
        excludes: ["Info.plist", "Pano.entitlements", "PanoDirect.entitlements"]
    dependencies:
      - package: PanoCore
      - package: PanoStore
      - package: PanoTransforms
      - package: PanoUI
    info:
      path: Pano/Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.cancetin.pano.clip
            UTTypeDescription: Pano clipboard item
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cancetin.pano
        PRODUCT_NAME: Pano
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: 5
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S2RH54MMT3
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Pano/Pano.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          CODE_SIGN_ENTITLEMENTS: Pano/Pano.entitlements
        DebugDirect:
          CODE_SIGN_ENTITLEMENTS: Pano/PanoDirect.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DIRECT_DISTRIBUTION
        ReleaseDirect:
          CODE_SIGN_ENTITLEMENTS: Pano/PanoDirect.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DIRECT_DISTRIBUTION

schemes:
  Pano:
    build:
      targets:
        Pano: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: PanoCore/PanoCoreTests
        - package: PanoStore/PanoStoreTests
        - package: PanoTransforms/PanoTransformsTests
        - package: PanoUI/PanoUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  PanoDirect:
    build:
      targets:
        Pano: all
    run:
      config: DebugDirect
    profile:
      config: ReleaseDirect
    analyze:
      config: DebugDirect
    archive:
      config: ReleaseDirect
