# Source of truth for Pano.xcodeproj. Regenerate after editing: `xcodegen generate`.
# The generated project is committed so CI and contributors need no extra tool.
name: Pano
options:
  bundleIdPrefix: com.cancetin
  deploymentTarget:
    macOS: "15.4"
  xcodeVersion: "16.4"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.4"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_HARDENED_RUNTIME: YES

packages:
  PanoCore:
    path: Packages/PanoCore
  PanoStore:
    path: Packages/PanoStore
  PanoTransforms:
    path: Packages/PanoTransforms
  PanoUI:
    path: Packages/PanoUI

targets:
  Pano:
    type: application
    platform: macOS
    sources:
      - path: Pano
        excludes: ["Info.plist", "Pano.entitlements"]
    dependencies:
      - package: PanoCore
      - package: PanoStore
      - package: PanoTransforms
      - package: PanoUI
    info:
      path: Pano/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Rows dragged inside the panel carry the clip id under this type (PanoUI/ClipDrag.swift).
        # Transferable's custom UTType only resolves when the app declares it here. It deliberately
        # does NOT conform to public.data: Finder would otherwise write it out as a file on drag-out.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.cancetin.pano.clip
            UTTypeDescription: Pano clipboard item
    # xcodegen writes Pano/Pano.entitlements from this block; edit here, not the file.
    # The entitlements file is a product statement (docs/04-permissions.md): sandbox and nothing else.
    entitlements:
      path: Pano/Pano.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Lets the app picker (NSOpenPanel, exclusion list) and cross-launch file paste-back read a
        # user-chosen file. Standard, benign, no network implication. See docs/adr/0003.
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cancetin.pano
        PRODUCT_NAME: Pano
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Pano/Pano.entitlements
        # Development signing locally; CI builds with CODE_SIGNING_ALLOWED=NO.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: S2RH54MMT3

schemes:
  Pano:
    build:
      targets:
        Pano: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: PanoCore/PanoCoreTests
        - package: PanoStore/PanoStoreTests
        - package: PanoTransforms/PanoTransformsTests
        - package: PanoUI/PanoUITests
